[project]
name = "labirinto"
version = "1.0.0"
description = "Avaliação da discilplina de Inteligência Artificial do professor Alexandre Augusto"
requires-python = ">=3.10"

dependencies = [
    "pygame>=2.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["algorithms", "main", "maze", "ui"]